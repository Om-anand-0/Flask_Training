<!DOCTYPE html>
<html>

<head>
    <title>Realtime Chat | {{ room.name }}</title>
    <!-- Add Socket.IO Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
        integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
        crossorigin="anonymous"></script>
</head>

<body style="margin:0; font-family:Arial, Helvetica, sans-serif; background-color:#f4f6f8;">

    <!-- Header -->
    <div
        style="background-color:#1f2937; color:white; padding:15px 25px; display:flex; justify-content:space-between; align-items:center;">

        <div>
            <a href="{{ url_for('chat.dashboard') }}"
                style="color:white; text-decoration:none; margin-right:15px; font-size:14px;">
                ← Back to Dashboard
            </a>

            <h1 style="margin:5px 0 0 0; display:inline-block;"># {{ room.name }}</h1>

            <p style="margin:5px 0 0 0; color:#d1d5db;">
                <i>{{ room.description }}</i>
            </p>
        </div>

        <!-- Leave Room Button Form -->
        <form action="{{ url_for('chat.leave_room_http', room_id=room.id) }}" method="POST" style="margin:0;">
            <button type="submit" title="Permanently leave this room"
                style="background-color:#dc2626; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-size:12px;">
                Leave Room
            </button>
        </form>

    </div>


    <!-- Chat Container -->
    <div
        style="max-width:800px; margin:20px auto; background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:flex; flex-direction:column; height:70vh;">

        <!-- Messages Box -->
        <div id="chat-box" style="flex:1; padding:20px; overflow-y:auto; border-bottom:1px solid #e5e7eb;">

            {% for message in room.messages %}

            <div
                style="margin-bottom:15px; padding:10px; background-color:#f9fafb; border-radius:8px; display:flex; gap:12px;">

                <!-- Avatar -->
                <div style="flex-shrink:0;">
                    <img src="{{ url_for('static', filename='images/' + message.author.avatar_url) }}"
                        alt="{{ message.author.username }}" width="40" height="40"
                        style="border-radius:50%; object-fit:cover;">
                </div>

                <div style="flex:1;">
                    <div style="margin-bottom:4px;">
                        <b style="color:#111827;">{{ message.author.username }}</b>
                        <small style="color:#6b7280; margin-left:5px;">
                            ({{ message.created_at.strftime('%H:%M') }})
                        </small>
                    </div>

                    <div style="color:#374151; word-break:break-word;">
                        {{ message.content }}
                    </div>
                </div>

            </div>

            {% endfor %}

        </div>


        <!-- Input Box -->
        <div style="padding:15px;">

            <form id="message-form" style="display:flex; gap:10px;">

                <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off"
                    style="flex:1; padding:10px; border-radius:6px; border:1px solid #d1d5db; outline:none; font-size:14px;">

                <button type="submit"
                    style="background-color:#2563eb; color:white; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px;">
                    Send
                </button>

            </form>

        </div>

    </div>

    <script type="text/javascript">
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var roomId = String("{{ room.id }}");
        var username = "{{ current_user.username }}";

        console.log("Connecting to room:", roomId);

        socket.on('connect', function () {
            console.log("Connected to server");
            socket.emit('join_room', { room_id: roomId });
        });

        socket.on('message', function (data) {
            console.log("Received message:", data);
            var chatBox = document.getElementById('chat-box');
            var msgDiv = document.createElement('div');
            if (data.msg.includes('joined') || data.msg.includes('left') || data.msg.includes('permanently')) {
                msgDiv.style.marginBottom = "15px";
                msgDiv.style.padding = "10px";
                msgDiv.style.textAlign = "center";
                msgDiv.innerHTML = `<small style="color:#6b7280; font-style:italic;">${data.msg}</small>`;
            } else {
                msgDiv.style.marginBottom = "15px";
                msgDiv.style.padding = "10px";
                msgDiv.style.backgroundColor = "#f9fafb";
                msgDiv.style.borderRadius = "8px";
                msgDiv.style.display = "flex";
                msgDiv.style.gap = "12px";

                var now = new Date();
                var time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
                var author = data.username || "Unknown";
                var avatarUrl = data.avatar_url || 'default.png';
                var imgSrc = "{{ url_for('static', filename='images/') }}" + avatarUrl;

                msgDiv.innerHTML = `
                    <div style="flex-shrink:0;">
                        <img src="${imgSrc}" 
                             alt="${author}"
                             width="40" height="40"
                             style="border-radius:50%; object-fit:cover;">
                    </div>
                    <div style="flex:1;">
                        <div style="margin-bottom:4px;">
                            <b style="color:#111827;">${author}</b>
                            <small style="color:#6b7280; margin-left:5px;">(${time})</small>
                        </div>
                        <div style="color:#374151; word-break:break-word;">
                            ${data.msg}
                        </div>
                    </div>`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        var form = document.getElementById('message-form');
        form.onsubmit = function (e) {
            e.preventDefault();
            var input = document.getElementById('message-input');
            var message = input.value;
            if (message.trim() !== "") {
                console.log("Sending message:", message);
                socket.emit('send_message', { room_id: roomId, message: message });
                input.value = '';
            }
        };

    </script>

</body>

</html>
