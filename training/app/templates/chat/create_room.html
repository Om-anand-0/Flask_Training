<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Chat | Create Room</title>
</head>

<body>

    <div>

        <div>
            <h2>Create a New Room</h2>
            <a href="{{ url_for('chat.dashboard') }}">Close</a>
        </div>

        <form method="POST" action="{{ url_for('chat.create_room') }}">

            <div>
                <label for="room_name">Room Name</label>
                <br>
                <input type="text" id="room_name" name="room_name" required placeholder="e.g. General-Chat">
            </div>

            <br>

            <div>
                <label for="description">Description</label>
                <br>
                <textarea id="description" name="description" rows="3"
                    placeholder="What is this room about?"></textarea>
            </div>

            <br>

            <div>
                <button type="submit">
                    Create Room
                </button>
            </div>

        </form>

    </div>

</body>

</html>
